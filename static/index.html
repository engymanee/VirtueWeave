<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VirtueWeave</title>
  <meta name="description" content="Tell VirtueWeave about your class and get coding practices that also grow a virtue.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230f9d8a'/%3E%3Cpath d='M6 12c6 4 14 4 20 0M5 18c7 4 15 4 22 0' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="weave" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="23" fill="var(--primary)"/>
      <path d="M8 18c9 6 23 6 32 0M7 26c10 6 24 6 34 0M12 33c7 4 17 4 24 0" stroke="#fff" stroke-opacity=".55" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <circle cx="17" cy="21" r="2.6" fill="#fff"/><circle cx="31" cy="21" r="2.6" fill="#fff"/>
      <circle cx="17.7" cy="21.4" r="1.2" fill="#12313a"/><circle cx="31.7" cy="21.4" r="1.2" fill="#12313a"/>
      <path d="M18 28c3.5 3 8.5 3 12 0" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </symbol>
  </svg>

  <header class="top">
    <div class="top-inner">
      <a class="brand" href="/" aria-label="VirtueWeave home">
        <svg class="logo" width="36" height="36" aria-hidden="true"><use href="#weave"/></svg>
        <span class="brand-name">VirtueWeave</span>
      </a>
      <p class="tagline">Coding practices that grow good character</p>
      <button class="icon-btn" id="theme" type="button" aria-label="Switch between light and dark mode">
        <span aria-hidden="true" id="theme-icon">🌙</span>
      </button>
    </div>
  </header>

  <main>
    <div id="log" class="log" role="log" aria-live="polite" aria-label="Conversation"></div>
  </main>

  <form id="composer" class="composer" autocomplete="off">
    <div class="composer-inner">
      <label for="sentence" class="sr-only">Describe your class</label>
      <textarea id="sentence" rows="1" maxlength="500"
        placeholder="Tell me about your class, for example: Teaching loops to my 6-year-olds, 15 minutes, they keep giving up."></textarea>
      <button id="send" class="send" type="submit" aria-label="Send">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 20 4l-6.5 16-2.6-6.9L3 11.5Z" fill="currentColor"/></svg>
      </button>
    </div>
    <p class="fineprint">VirtueWeave suggests ideas. You know your class best.</p>
  </form>

  <script src="/static/app.js"></script>
</body>
</html>
