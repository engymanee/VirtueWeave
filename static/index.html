<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VirtueWeave</title>
  <meta name="description" content="Pick a computer science topic, a grade and your time. VirtueWeave recommends three virtues to weave into the lesson and shows how.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23008037'/%3E%3Cpath d='M9 22c0-7 4-11 11-12-1 7-4 11-11 12Z' fill='%23a4eba2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="/" aria-label="VirtueWeave home">
        <svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true">
          <circle cx="20" cy="20" r="20" fill="var(--green)"/>
          <path d="M11 27c0-9 5-14 15-15-1 9-5 14-15 15Z" fill="var(--leaf)"/>
        </svg>
        <span>VirtueWeave</span>
      </a>
      <button class="icon-btn" id="theme" type="button" aria-label="Switch between light and dark mode">
        <span aria-hidden="true" id="theme-icon">🌙</span>
      </button>
    </div>
  </header>

  <main>
    <section class="intro">
      <div class="wrap">
        <h1>Weave a virtue into <span>your computer science lesson</span></h1>
        <p class="lead">Choose what you're teaching. We'll recommend <b>three virtues</b> that fit it
          and show you <b>how</b> to bring each one in.</p>

        <form id="ask" class="ask" autocomplete="off">
          <div class="field f-topic">
            <label for="topic">Topic</label>
            <select id="topic" required></select>
          </div>
          <div class="field f-grade">
            <label for="grade">Grade</label>
            <select id="grade" required></select>
          </div>
          <div class="field f-min">
            <label for="minutes">Minutes</label>
            <input id="minutes" type="number" inputmode="numeric" min="1" max="180" value="15" required>
          </div>
          <div class="field f-note">
            <label for="note">Note <span class="opt">(optional)</span></label>
            <input id="note" type="text" maxlength="300" placeholder="e.g. they keep giving up">
          </div>
          <button id="send" class="btn" type="submit">Recommend</button>
        </form>
        <p class="example"><button type="button" id="example" class="link">Try an example</button></p>
      </div>
    </section>

    <section class="results" id="results" hidden aria-labelledby="results-title">
      <div class="wrap">
        <h2 id="results-title" tabindex="-1">Your three virtues</h2>
        <div id="results-body" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap"><p>VirtueWeave suggests ideas. You know your class best.</p></div>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
